[theme]
primaryColor = "#DC143C"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#FAFAFA"
font = "sans serif"

[server]
maxUploadSize = 200
maxMessageSize = 200
# Sert static/ sous /app/static/ : image de partage og-default.jpg (deploy/patch_index_html.py).
enableStaticServing = true

[browser]
gatherUsageStats = false
